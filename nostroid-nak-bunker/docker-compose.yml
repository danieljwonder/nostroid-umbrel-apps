version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: nostroid-nak-bunker_web_1
      APP_PORT: 8080

  # Upstream nak (checksum-pinned release binary) + web unlock shim.
  # Source: https://github.com/danieljwonder/nak-bunker-umbrel
  web:
    image: ghcr.io/danieljwonder/nak-bunker-umbrel:v0.22.3-2@sha256:1f9ffda7cadf59a9e9fe140ad498f3336cd328e9a37434b93a6733be3b80e20f
    init: true
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 20s
    volumes:
      - ${APP_DATA_DIR}/data:/data
