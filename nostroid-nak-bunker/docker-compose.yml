version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: nostroid-nak-bunker_web_1
      APP_PORT: 8080

  # Upstream nak (checksum-pinned release binary) + web unlock shim.
  # Source: https://github.com/danieljwonder/nak-bunker-umbrel
  web:
    image: ghcr.io/danieljwonder/nak-bunker-umbrel:v0.22.3-3@sha256:79eec7804030d39894b279feb5a75b3b783e87430ed58ab25d5f084723fb2a6a
    init: true
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 20s
    volumes:
      - ${APP_DATA_DIR}/data:/data
