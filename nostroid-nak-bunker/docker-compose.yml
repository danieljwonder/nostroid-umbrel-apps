version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: nostroid-nak-bunker_web_1
      APP_PORT: 8080

  # Upstream nak (checksum-pinned release binary) + web unlock shim.
  # Source: https://github.com/danieljwonder/nak-bunker-umbrel
  web:
    image: ghcr.io/danieljwonder/nak-bunker-umbrel:v0.22.3-4@sha256:cd7f89c802503b96604ed445f8f60bfa6b72ae4c5f3747f029cdae8385154e03
    init: true
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 20s
    volumes:
      - ${APP_DATA_DIR}/data:/data
