version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: nostroid-nak-bunker_web_1
      APP_PORT: 8080

  # Upstream nak (checksum-pinned release binary) + web unlock shim.
  # Source: https://github.com/danieljwonder/nak-bunker-umbrel
  web:
    image: ghcr.io/danieljwonder/nak-bunker-umbrel:v0.22.3-5@sha256:ac7d95ad09eb498e776d36276a58bb075f0746fd9b0dd8795b50a27d1a237c88
    init: true
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 20s
    volumes:
      - ${APP_DATA_DIR}/data:/data
