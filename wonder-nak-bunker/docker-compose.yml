version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: wonder-nak-bunker_web_1
      APP_PORT: 8080

  # Upstream nak (checksum-pinned release binary) + web unlock shim.
  # Source: https://github.com/danieljwonder/nak-bunker-umbrel
  web:
    image: ghcr.io/danieljwonder/nak-bunker-umbrel:v0.22.3-1@sha256:7c13d4b4bebecd80dcaf97f3cce95081691f303f88b1025b75ee1bc5b57ecc39
    init: true
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 20s
    volumes:
      - ${APP_DATA_DIR}/data:/data
